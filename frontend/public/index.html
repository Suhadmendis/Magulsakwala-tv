<link rel="stylesheet" href="src/styles.css">
<script>
  // Point this at the PHP backend if it's served from a different origin
  // than this frontend. Leave as '' if both are served from the same origin.
  window.API_BASE = window.API_BASE || 'http://localhost:8100';

  // Apply saved theme before first paint (avoids a flash of the wrong
  // theme). No saved preference = follow the OS (handled by CSS alone).
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
</head>
